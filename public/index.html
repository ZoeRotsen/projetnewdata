<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carte MongoDB + Leaflet</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <!-- CSS pour les clusters Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <!-- JS du plugin de clustering -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #f3f6ff 0, #eef1f7 40%, #e4e7ee 100%);
      color: #212529;
    }

    /* Titre principal en mode "bandeau" */
    h2.m-3 {
      position: relative;
      margin: 0;
      padding: 1.4rem 2rem 1.1rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #111827;
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.97), rgba(248, 250, 252, 0.98));
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }


    /* CARTE */

    #map {
      height: calc(100vh - 80px);
      width: 100%;
      margin-top: 80px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
    }

    /* PANNEAUX FLOTTANTS (stats / filtres / légende) */

    #stats-panel,
    #filters-panel,
    #legend-panel {
      position: fixed;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 0.9rem;
      border: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.15);
      backdrop-filter: blur(6px);
    }

    /* Stats à droite, en haut */
    #stats-panel {
      top: 80px;
      right: 20px;
      width: 360px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
      padding: 1.1rem 1.1rem 1.25rem 1.1rem;
    }

    /* Filtres à gauche */
    #filters-panel {
      top: 140px;
      left: 20px;
      width: 300px;
    }

    /* Légende en bas à droite */
    #legend-panel {
      bottom: 20px;
      right: 20px;
      width: 260px;
    }

    /* Titres de cartes */
    #filters-panel .card-title,
    #legend-panel .card-title,
    #stats-panel h5 {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #495057;
    }

    /* Contenu stats */
    #stats-content {
      max-height: 250px;
      overflow-y: auto;
      padding: 0.5rem;
      background-color: #ffffff;
      border: 1px solid #dee2e6;
      border-radius: 0.6rem;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
    }

    #stats-content div.cuisine-item {
      margin-bottom: 0.75rem;
      padding: 0.5rem 0.65rem;
      background-color: #f5f7fb;
      border-radius: 0.5rem;
    }

    #stats-content div.cuisine-item b {
      display: block;
      margin-bottom: 0.15rem;
      color: #343a40;
    }

    #stats-content span.score {
      font-weight: 600;
      color: #0d6efd;
    }

    #stats-content span.min {
      color: #dc3545;
      font-weight: 600;
    }

    #stats-content span.max {
      color: #198754;
      font-weight: 600;
    }

    /* Lignes de formulaires dans les panneaux */
    #filters-panel .form-label,
    #stats-panel .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #6c757d;
    }

    #filters-panel .form-select,
    #filters-panel .form-control,
    #stats-panel .form-select {
      font-size: 0.85rem;
    }

    /* Boutons des panneaux */
    #filters-panel .btn,
    #stats-panel .btn {
      border-radius: 999px;
      font-size: 0.8rem;
      padding-inline: 0.9rem;
    }

    /* Légende des scores */
    .legend-color-box {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid #333;
    }

    .legend-green {
      background-color: #198754; /* vert */
    }

    .legend-orange {
      background-color: #fd7e14; /* orange */
    }

    .legend-red {
      background-color: #dc3545; /* rouge */
    }

    /* RESPONSIVE */

    @media (max-width: 992px) {
      #stats-panel,
      #filters-panel,
      #legend-panel {
        position: static;
        width: auto;
        margin: 0 1rem 1rem 1rem;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
      }

      #map {
        height: calc(100vh - 260px);
        margin-top: 0;
      }
    }

    /* LEAFLET & CLUSTERS */

    /* Popup plus moderne */
    .leaflet-popup-content-wrapper {
      border-radius: 0.85rem;
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.25);
    }

    .leaflet-popup-content {
      margin: 10px 14px;
      font-size: 0.9rem;
    }

    /* Bouton Restaurants proches dans le popup */
    .leaflet-popup-content .popup-near-btn {
      font-size: 0.7rem;
      border-radius: 999px;
    }

    /* Clusters plus "dashboard" */
    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large {
      background-color: rgba(13, 110, 253, 0.15);
      border-radius: 50%;
    }

    .marker-cluster-small div,
    .marker-cluster-medium div,
    .marker-cluster-large div {
      background-color: #0d6efd;
      color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.3);
      font-weight: 600;
      border: 2px solid #ffffff;
    }

    /* On augmente légèrement la taille sur les gros groupes */
    .marker-cluster-small div {
      width: 28px;
      height: 28px;
      line-height: 28px;
    }

    .marker-cluster-medium div {
      width: 32px;
      height: 32px;
      line-height: 32px;
    }

    .marker-cluster-large div {
      width: 36px;
      height: 36px;
      line-height: 36px;
    }

    /* Contrôles de zoom Leaflet un peu plus propres */
    .leaflet-control-zoom a {
      border-radius: 8px !important;
    }

    /* POPUP : icône EDIT */

    .popup-edit-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .edit-icon {
      width: 22px;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.2s, transform 0.12s;
    }

    .edit-icon:hover {
      opacity: 1;
      transform: scale(1.06);
    }

    /* MODALS */

    .modal-content {
      border-radius: 1rem;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.35);
    }

    .modal-header {
      border-bottom: 1px solid #e5e7eb;
      background: linear-gradient(90deg, rgba(13, 110, 253, 0.05), rgba(13, 202, 240, 0.03));
    }

    .modal-title {
      font-weight: 600;
    }

    .modal-footer {
      border-top: 1px solid #e5e7eb;
    }

    /* Champs du formulaire modal */
    #add-form .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #6c757d;
    }

    #add-form .form-control {
      font-size: 0.85rem;
    }

    /* Boutons modals */
    #add-form .btn {
      border-radius: 999px;
      font-size: 0.8rem;
    }

    /* SLIDER NEAR MODAL */

    #near-modal .modal-content {
      border-radius: 0.9rem;
    }

    #near-range {
      width: 100%;
    }

    #near-range::-webkit-slider-thumb {
      background-color: #0d6efd;
    }

    /* BOUTON STATS FLOTTANT (mobile) */

    #stats-open-btn {
      border-radius: 999px;
    }

  </style>
</head>

<body>

  <h2 class="m-3">Carte des restaurants</h2>

  <!--Bouton de Stats-->
  <button id="stats-open-btn" class="btn btn-info btn-sm position-fixed top-0 end-0 m-3" style="display:none">Afficher les statistiques</button>

  <!--Panneau des Stats-->
  <div id="stats-panel" class="card shadow p-3">
    <button type="button" id="stats-close-btn" class="btn-close position-absolute top-0 end-0 m-2" aria-label="Fermer"></button>
    <label for="stats-select" class="form-label fw-bold">Statistiques</label>
    <select id="stats-select" class="form-select mb-3">
      <option value="message">Sélectionner une statistique</option>
      <option value="AvgScoreCuisine">Score moyen par cuisine</option>
      <option value="DistScoreCuisine">Distributions des scores par cuisine</option>
      <option value="BestRestau">Meilleur restaurant par cuisine</option>
    </select>

    <label for="display-mode" class="form-label fw-bold">Mode d'affichage</label>
    <select id="display-mode" class="form-select mb-3">
      <option value="text">Texte</option>
      <option value="chart">Graphique</option>
    </select>

    <!-- Zone d'affichage de CSS -->
    <div id="stats-content" class="border rounded bg-light p-2 mb-3" style="display: none;">
    </div>

    <canvas id="stats-chart" style="display: none;"></canvas>
  </div>
  <div id="filters-panel" class="card shadow p-3 mt-3">
    <h5 class="card-title">Filtres</h5>

    <div class="mb-2">
      <label for="filter-cuisine" class="form-label">Cuisine</label>
      <select id="filter-cuisine" class="form-select form-select-sm">
        <option value="">Toutes</option>
      </select>
    </div>

    <div class="mb-2">
      <label for="filter-borough" class="form-label">Quartier</label>
      <select id="filter-borough" class="form-select form-select-sm">
        <option value="">Tous</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="filter-min-score" class="form-label">Score minimum</label>
      <input id="filter-min-score" type="number" class="form-control form-control-sm" min="0" step="1" placeholder="ex: 10">
    </div>

    <div class="d-flex justify-content-between">
      <button id="filter-apply" class="btn btn-primary btn-sm">Appliquer</button>
      <button id="filter-reset" class="btn btn-outline-secondary btn-sm">Réinitialiser</button>
    </div>

    <hr class="my-2">

    <button id="add-open" class="btn btn-success btn-sm w-100">
      Ajouter un restaurant
    </button>
  </div>

  <!-- Ajout de la légende -->
  <div id="legend-panel" class="card shadow p-3">
    <h6 class="card-title mb-2">Légende des scores</h6>

    <div class="d-flex align-items-center mb-1">
      <span class="legend-color-box legend-green me-2"></span>
      <span class="small">Score &lt; 10 : bon</span>
    </div>

    <div class="d-flex align-items-center mb-1">
      <span class="legend-color-box legend-orange me-2"></span>
      <span class="small">10 ≤ score &lt; 20 : moyen</span>
    </div>

    <div class="d-flex align-items-center">
      <span class="legend-color-box legend-red me-2"></span>
      <span class="small">Score ≥ 20 : à surveiller</span>
    </div>
  </div>

  <div id="map"></div>

  <!-- Formulaire pour ajouter un restaurant -->
  <div class="modal fade" id="add-modal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="add-form">
          <div class="modal-header">
            <h5 class="modal-title">Ajouter un restaurant</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
          </div>

          <div class="modal-body">
            <!-- NOM -->
            <div class="mb-2">
              <label for="add-name" class="form-label">Nom</label>
              <input type="text" id="add-name" class="form-control form-control-sm" required>
            </div>

            <!-- CUISINE -->
            <div class="mb-2">
              <label for="add-cuisine" class="form-label">Cuisine</label>
              <input type="text" id="add-cuisine" class="form-control form-control-sm" required>
            </div>

            <!-- QUARTIER -->
            <div class="mb-2">
              <label for="add-borough" class="form-label">Quartier</label>
              <input type="text" id="add-borough" class="form-control form-control-sm" required>
            </div>

            <hr class="my-2">

            <!-- ADRESSE -->
            <div class="mb-2">
              <label for="add-building" class="form-label">Numéro de bâtiment</label>
              <input type="text" id="add-building" class="form-control form-control-sm">
            </div>

            <div class="mb-2">
              <label for="add-street" class="form-label">Rue</label>
              <input type="text" id="add-street" class="form-control form-control-sm">
            </div>

            <div class="mb-2">
              <label for="add-zipcode" class="form-label">Code postal</label>
              <input type="text" id="add-zipcode" class="form-control form-control-sm">
            </div>

            <hr class="my-2">

            <!-- COORDONNÉES (choisies en cliquant la carte) -->
            <div class="mb-2">
              <label for="add-lat" class="form-label">Latitude</label>
              <input id="add-lat" type="text" class="form-control form-control-sm" readonly>
            </div>

            <div class="mb-2">
              <label for="add-lng" class="form-label">Longitude</label>
              <input id="add-lng" type="text" class="form-control form-control-sm" readonly>
              <div class="form-text">
                Clique sur le bouton puis sur la carte.
              </div>
              <button type="button" id="add-pick-map" class="btn btn-outline-primary btn-sm mt-2">
                Choisir sur la carte
              </button>
            </div>

            <hr>

            <!-- NOTE (une seule note simple) -->
            <div class="mb-2">
              <label for="add-grade" class="form-label">Grade (A/B/C…)</label>
              <input id="add-grade" type="text" maxlength="1" class="form-control form-control-sm">
            </div>

            <div class="mb-2">
              <label for="add-score" class="form-label">Score</label>
              <input id="add-score" type="number" min="0" class="form-control form-control-sm">
            </div>

            <hr>

            <!-- RESTAURANT ID (optionnel) -->
            <div class="mb-2">
              <label for="add-rest-id" class="form-label">Restaurant ID (optionnel)</label>
              <input id="add-rest-id" type="text" class="form-control form-control-sm">
            </div>

          </div>

          <!-- Bouton du formulaire/Modal-->
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
              Annuler
            </button>
            <button type="button" id="form-delete-btn" class="btn btn-danger btn-sm d-none">
              Supprimer
            </button>
            <button type="submit" class="btn btn-primary btn-sm">
              Enregistrer
            </button>
          </div>
        
        </form>
      </div>
    </div>
  </div>
  
  <!-- Modal pour le graphique -->
  <div class="modal fade" id="chartModal" tabindex="-1" aria-labelledby="chartModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="chartModalLabel">Graphique des statistiques</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <canvas id="modal-chart" style="width: 100%; height: 150px;"></canvas>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal pour les restaurants proches -->
  <div class="modal fade" id="near-modal">
  <div class="modal-dialog">
    <div class="modal-content p-3">

      <h5>Rayon de recherche</h5>

      <input type="range" id="near-range" min="100" max="2000" step="100" value="1000">
      <div>
        Distance : <span id="near-range-value">1000</span> m
      </div>

      <button class="btn btn-primary mt-3" id="near-launch">Rechercher</button>

    </div>
  </div>
</div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
</body>
</html>
